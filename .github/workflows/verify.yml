name: Verify Interactive Lab

on:
  push:
    branches: [feature/screenshot-mystery-v07, feature/mobile-lab-pwa-v06, feature/dossier-passport-v05, feature/local-levels-v04, feature/message-simulation-v03, feature/interactive-lab-v02]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Scripted browser journeys (desktop and mobile)
        run: npm run test:e2e
      - name: Production PWA installability and offline journeys
        run: npm run test:pwa
